services:
  app:
    build:
      context: .
      target: runner
    container_name: baeinah_app
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_PATH: /app/data/baeinah.db
      UPLOAD_DIR: /app/uploads
    volumes:
      - baeinah_data:/app/data
      - baeinah_uploads:/app/uploads
    ports:
      - "127.0.0.1:3000:3000"   # متاح لـ Nginx فقط — لا يُكشف للخارج
    networks:
      - baeinah_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Watchtower — تحديث تلقائي عند رفع صورة جديدة
  watchtower:
    image: containrrr/watchtower
    container_name: baeinah_watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 300 --cleanup baeinah_app
    networks:
      - baeinah_net

volumes:
  baeinah_data:
  baeinah_uploads:

networks:
  baeinah_net:
    driver: bridge
