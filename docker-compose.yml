version: '3.9'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: bayyinah_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       bayyinah
      POSTGRES_USER:     bayyinah
      POSTGRES_PASSWORD: ${DB_PASSWORD:-bayyinah_dev}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bayyinah"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - bayyinah_net

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bayyinah_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV:            production
      PORT:                3000
      DATABASE_URL:        postgresql://bayyinah:${DB_PASSWORD:-bayyinah_dev}@postgres:5432/bayyinah
      DB_SSL:              "false"
      JWT_SECRET:          ${JWT_SECRET}
      JWT_REFRESH_SECRET:  ${JWT_REFRESH_SECRET}
      ANTHROPIC_API_KEY:   ${ANTHROPIC_API_KEY}
      MOYASAR_API_KEY:     ${MOYASAR_API_KEY:-}
      MOYASAR_SECRET_KEY:  ${MOYASAR_SECRET_KEY:-}
      APP_URL:             ${APP_URL:-http://localhost:3000}
      CORS_ORIGINS:        ${CORS_ORIGINS:-http://localhost:3000}
    volumes:
      - uploads:/app/uploads
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - bayyinah_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  pg_data:
  uploads:

networks:
  bayyinah_net:
    driver: bridge
