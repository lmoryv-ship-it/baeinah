<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول — بَيِّنة</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">

<div class="auth-card">
  <div class="auth-logo">⚖️ بَيِّنة</div>

  <div class="card">
    <div class="card-body">
      <!-- Tabs -->
      <div class="tab-nav">
        <button id="tab-login" class="active" onclick="showTab('login')">تسجيل الدخول</button>
        <button id="tab-register" onclick="showTab('register')">إنشاء حساب</button>
      </div>

      <!-- Alert -->
      <div id="alert" class="hidden"></div>

      <!-- Login Form -->
      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label">البريد الإلكتروني</label>
          <input type="email" id="login-email" class="form-control" placeholder="example@firm.com" required>
        </div>
        <div class="form-group">
          <label class="form-label">كلمة المرور</label>
          <input type="password" id="login-password" class="form-control" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="login-btn">
          <span>تسجيل الدخول</span>
        </button>
      </form>

      <!-- Register Form -->
      <form id="register-form" class="hidden" onsubmit="handleRegister(event)">
        <div class="grid-2">
          <div class="form-group">
            <label class="form-label">اسم المنظمة</label>
            <input type="text" id="org-name" class="form-control" placeholder="مكتب الأنظمة القانونية" required>
          </div>
          <div class="form-group">
            <label class="form-label">المعرّف الفريد</label>
            <input type="text" id="org-slug" class="form-control" placeholder="al-andzima" required>
            <div class="form-hint">حروف صغيرة وأرقام وشرطات فقط</div>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">اسمك الكامل</label>
          <input type="text" id="reg-name" class="form-control" placeholder="أحمد محمد العتيبي" required>
        </div>
        <div class="form-group">
          <label class="form-label">البريد الإلكتروني</label>
          <input type="email" id="reg-email" class="form-control" placeholder="ahmed@firm.com" required>
        </div>
        <div class="form-group">
          <label class="form-label">كلمة المرور</label>
          <input type="password" id="reg-password" class="form-control" placeholder="8 أحرف على الأقل" required minlength="8">
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="reg-btn">
          <span>إنشاء الحساب مجاناً</span>
        </button>
      </form>
    </div>
  </div>

  <p class="text-center text-muted mt-4" style="font-size:.8rem;">
    بالتسجيل أنت توافق على <a href="#">الشروط والأحكام</a> وسياسة الخصوصية
  </p>
</div>

<script src="/js/api.js"></script>
<script>
  redirectIfAuth();

  // Switch tab from hash
  if (window.location.hash === '#register') showTab('register');

  function showTab(tab) {
    const isLogin = tab === 'login';
    document.getElementById('tab-login').classList.toggle('active', isLogin);
    document.getElementById('tab-register').classList.toggle('active', !isLogin);
    document.getElementById('login-form').classList.toggle('hidden', !isLogin);
    document.getElementById('register-form').classList.toggle('hidden', isLogin);
    clearAlert();
  }

  function showAlert(msg, type = 'error') {
    const el = document.getElementById('alert');
    el.className = `alert alert-${type}`;
    el.textContent = msg;
    el.classList.remove('hidden');
  }
  function clearAlert() {
    const el = document.getElementById('alert');
    el.className = 'hidden';
    el.textContent = '';
  }

  async function handleLogin(e) {
    e.preventDefault();
    clearAlert();
    const btn = document.getElementById('login-btn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> جاري التحقق...';
    try {
      const data = await api.auth.login({
        email:    document.getElementById('login-email').value,
        password: document.getElementById('login-password').value,
      });
      saveTokens(data.access_token, data.refresh_token);
      saveUser(data.user);
      window.location.href = data.user.role === 'platform_admin' ? '/admin.html' : '/dashboard.html';
    } catch (err) {
      showAlert(err.message || 'حدث خطأ، يرجى المحاولة مجدداً');
      btn.disabled = false;
      btn.innerHTML = '<span>تسجيل الدخول</span>';
    }
  }

  async function handleRegister(e) {
    e.preventDefault();
    clearAlert();
    const btn = document.getElementById('reg-btn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> جاري الإنشاء...';
    try {
      const data = await api.auth.register({
        orgName:  document.getElementById('org-name').value,
        orgSlug:  document.getElementById('org-slug').value,
        name:     document.getElementById('reg-name').value,
        email:    document.getElementById('reg-email').value,
        password: document.getElementById('reg-password').value,
      });
      saveTokens(data.access_token, data.refresh_token);
      saveUser(data.user);
      window.location.href = '/dashboard.html';
    } catch (err) {
      showAlert(err.message || 'حدث خطأ، يرجى المحاولة مجدداً');
      btn.disabled = false;
      btn.innerHTML = '<span>إنشاء الحساب مجاناً</span>';
    }
  }

  // Auto-format slug from org name
  document.getElementById('org-name')?.addEventListener('input', (e) => {
    const slug = e.target.value
      .toLowerCase()
      .replace(/\s+/g, '-')
      .replace(/[^a-z0-9-]/g, '')
      .replace(/--+/g, '-')
      .replace(/^-|-$/g, '');
    document.getElementById('org-slug').value = slug;
  });
</script>
</body>
</html>
