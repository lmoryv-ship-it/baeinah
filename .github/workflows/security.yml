name: Security Audit

on:
  schedule:
    - cron: '0 6 * * 1'   # كل اثنين الساعة 6 صباحاً
  push:
    paths:
      - 'package*.json'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high
