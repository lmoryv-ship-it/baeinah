<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بَيِّنة — نتيجة الدفع</title>
    <link rel="stylesheet" href="css/landing.css">
    <style>
        body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg); }
        .callback-box { background: #fff; border-radius: 16px; padding: 48px 40px; max-width: 480px; width: 90%; text-align: center; box-shadow: 0 12px 48px rgba(0,0,0,.12); }
        .callback-icon { font-size: 4rem; margin-bottom: 20px; }
        .callback-box h2 { font-size: 1.5rem; font-weight: 800; margin-bottom: 12px; }
        .callback-box p  { color: var(--muted); font-size: .95rem; line-height: 1.7; margin-bottom: 28px; }
        .loader-ring { width: 48px; height: 48px; border: 4px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 24px; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
<div class="callback-box" id="box">
    <div class="loader-ring"></div>
    <h2>جارٍ التحقق من الدفع…</h2>
    <p>يرجى الانتظار</p>
</div>
<script>
(function () {
    const params = new URLSearchParams(location.search);
    const status = params.get('status') || params.get('payment_status');
    const box    = document.getElementById('box');

    function render(icon, title, body, delay, url) {
        box.innerHTML = `
            <div class="callback-icon">${icon}</div>
            <h2>${title}</h2>
            <p>${body}</p>
            <a href="${url}" class="btn btn-accent" style="display:inline-flex;margin-top:8px">متابعة</a>
        `;
        if (delay) setTimeout(() => { location.href = url; }, delay);
    }

    if (status === 'paid' || status === 'succeeded') {
        render('✅', 'تم الدفع بنجاح!',
            'جارٍ تفعيل اشتراكك… سيتم توجيهك للوحة التحكم خلال ثوانٍ.',
            4000, '/dashboard.html');
    } else if (status === 'failed' || status === 'canceled') {
        render('❌', 'لم يكتمل الدفع',
            'لم نتمكن من معالجة الدفع. يمكنك المحاولة مرة أخرى.',
            null, '/pricing.html');
    } else {
        // unknown — check after a moment
        setTimeout(() => {
            render('⏳', 'جارٍ مراجعة الطلب',
                'قد يستغرق التأكيد لحظات. سنُحدّث حالة اشتراكك تلقائياً.',
                5000, '/dashboard.html');
        }, 2000);
    }
})();
</script>
</body>
</html>
