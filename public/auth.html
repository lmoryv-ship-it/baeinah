<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بَيِّنة — تسجيل الدخول</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-logo">
            <span>⚖</span>
            <h1>بَيِّنة</h1>
        </div>

        <div class="auth-tabs">
            <button class="auth-tab active" id="loginTab" onclick="switchTab('login')">تسجيل الدخول</button>
            <button class="auth-tab" id="registerTab" onclick="switchTab('register')">حساب جديد</button>
        </div>

        <!-- نموذج تسجيل الدخول -->
        <form id="loginForm" class="auth-form" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="loginEmail">البريد الإلكتروني</label>
                <input type="email" id="loginEmail" placeholder="example@domain.com" required>
            </div>
            <div class="form-group">
                <label for="loginPassword">كلمة المرور</label>
                <div class="password-wrapper">
                    <input type="password" id="loginPassword" placeholder="••••••••" required>
                    <button type="button" class="toggle-password" onclick="togglePassword('loginPassword')">👁</button>
                </div>
            </div>
            <div id="loginError" class="form-error hidden"></div>
            <button type="submit" class="btn btn-primary btn-large" id="loginBtn">
                <span id="loginBtnText">دخول</span>
                <span class="loader hidden" id="loginLoader"></span>
            </button>
        </form>

        <!-- نموذج إنشاء الحساب -->
        <form id="registerForm" class="auth-form hidden" onsubmit="handleRegister(event)">
            <div class="form-group">
                <label for="regName">الاسم الكامل</label>
                <input type="text" id="regName" placeholder="محمد العمري" required>
            </div>
            <div class="form-group">
                <label for="regEmail">البريد الإلكتروني</label>
                <input type="email" id="regEmail" placeholder="example@domain.com" required>
            </div>
            <div class="form-group">
                <label for="regPhone">رقم الجوال (اختياري)</label>
                <input type="tel" id="regPhone" placeholder="05xxxxxxxx">
            </div>
            <div class="form-group">
                <label for="regRole">نوع الحساب</label>
                <select id="regRole">
                    <option value="individual">فرد</option>
                    <option value="startup">شركة ناشئة</option>
                    <option value="medical">قطاع طبي</option>
                    <option value="enterprise">مؤسسة</option>
                </select>
            </div>
            <div class="form-group">
                <label for="regPassword">كلمة المرور</label>
                <div class="password-wrapper">
                    <input type="password" id="regPassword" placeholder="8 أحرف على الأقل" required minlength="8">
                    <button type="button" class="toggle-password" onclick="togglePassword('regPassword')">👁</button>
                </div>
            </div>
            <div id="registerError" class="form-error hidden"></div>
            <button type="submit" class="btn btn-primary btn-large" id="registerBtn">
                <span id="registerBtnText">إنشاء الحساب</span>
                <span class="loader hidden" id="registerLoader"></span>
            </button>
            <p class="auth-note">تجربة مجانية 3 أيام · لا بطاقة ائتمان مطلوبة</p>
        </form>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
